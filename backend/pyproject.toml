[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sql-analytics-copilot-backend"
version = "0.1.0"
description = "Backend foundation for the AI SQL Analytics Copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "openai>=1.60,<2.0",
    "sqlglot>=27.0,<28.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires a live PostgreSQL analytics database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
