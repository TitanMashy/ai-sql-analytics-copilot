[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sql-analytics-copilot-backend"
version = "0.1.0"
description = "Backend foundation for the AI SQL Analytics Copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "google-genai>=1.0,<2.0",
    "openai>=1.60,<4.0",
    "sqlglot>=27.0,<28.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "prometheus-client>=0.20,<1.0",
    "pyjwt>=2.8,<3.0",
    "redis>=5.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]
# Optional OpenTelemetry tracing (OTEL_ENABLED=true). Not needed otherwise.
tracing = [
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL analytics database (and Redis for limiter tests)",
    "fuzz: randomized validator tests; FUZZ_ITERATIONS controls how many cases run",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/db/seed.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Start lenient and tighten per module as the baseline is cleaned up.
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]
