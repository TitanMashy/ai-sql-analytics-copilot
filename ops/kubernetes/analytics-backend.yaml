# Example Kubernetes manifests for the backend. They show the production shape (probes, rolling
# updates, secrets as files, a one-shot migration Job, a retention CronJob); adapt names, images,
# resources, and ingress to your cluster. The frontend is a plain Deployment of the frontend image
# with INTERNAL_API_URL pointing at this Service.
#
# Secrets are mounted as files and referenced through the *_FILE variables, so they never appear in
# `kubectl describe pod`, `docker inspect`, or the process environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-backend-config
data:
  APP_ENV: production
  LLM_MODE: gemini
  AUTH_MODE: jwt
  JWT_ALGORITHM: RS256
  JWT_ISSUER: https://idp.example.com/
  JWT_AUDIENCE: analytics-api
  CONVERSATION_STORE: postgres
  RATE_LIMIT_BACKEND: redis
  RATE_LIMIT_FAIL_MODE: open
  AUDIT_SINK: both
  REQUEST_DEADLINE_SECONDS: "25"
  QUERY_COST_LIMIT: "1000000"
  # The Service is only reachable from the frontend pods; narrow this to their pod CIDR.
  FORWARDED_ALLOW_IPS: "*"
  DATABASE_URL_FILE: /var/run/secrets/analytics/database_url
  ANALYTICS_DATABASE_URL_FILE: /var/run/secrets/analytics/analytics_database_url
  GEMINI_API_KEY_FILE: /var/run/secrets/analytics/gemini_api_key
  JWT_PUBLIC_KEY_FILE: /var/run/secrets/analytics/jwt_public_key
  METRICS_TOKEN_FILE: /var/run/secrets/analytics/metrics_token
  REDIS_URL_FILE: /var/run/secrets/analytics/redis_url
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-backend
  labels: {app: analytics-backend}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the current capacity during a deploy
      maxSurge: 1
  selector:
    matchLabels: {app: analytics-backend}
  template:
    metadata:
      labels: {app: analytics-backend}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 40   # longer than REQUEST_DEADLINE_SECONDS so /ask can finish
      containers:
        - name: backend
          image: ghcr.io/your-org/analytics-backend:1.0.0   # immutable version tag, never :latest
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: analytics-backend-config}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: secrets, mountPath: /var/run/secrets/analytics, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          # Liveness: the process is up. It never touches a dependency, so a database or LLM
          # outage cannot make Kubernetes restart healthy pods.
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: both databases are reachable (and Redis, when it must fail closed).
          # A degraded body (missing LLM key, Redis down while failing open) is still HTTP 200,
          # so the pod stays in service; alerts, not probes, report degradation.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 20
      volumes:
        - name: secrets
          secret: {secretName: analytics-backend-secrets}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-backend
spec:
  selector: {app: analytics-backend}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics-backend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: analytics-backend}
---
# Run before (or as the first step of) every release. The backend never migrates at startup, so a
# rolling deploy of N replicas never races N migrations. Migrations are expand-only until the old
# version is gone; see docs/operations.md, "Migrations".
apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-migrate-1-0-0
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true}
      containers:
        - name: migrate
          image: ghcr.io/your-org/analytics-backend:1.0.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: analytics-backend-config}
          volumeMounts:
            - {name: secrets, mountPath: /var/run/secrets/analytics, readOnly: true}
      volumes:
        - name: secrets
          secret: {secretName: analytics-backend-secrets}
---
# Retention: removes conversations idle longer than CONVERSATION_TTL_DAYS and audit rows older
# than AUDIT_RETENTION_DAYS. Idempotent; safe to run concurrently with the application.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: analytics-purge
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true}
          containers:
            - name: purge
              image: ghcr.io/your-org/analytics-backend:1.0.0
              command: ["python", "-m", "app.jobs.purge"]
              envFrom:
                - configMapRef: {name: analytics-backend-config}
              volumeMounts:
                - {name: secrets, mountPath: /var/run/secrets/analytics, readOnly: true}
          volumes:
            - name: secrets
              secret: {secretName: analytics-backend-secrets}
