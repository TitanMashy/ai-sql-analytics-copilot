services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app@postgres:5432/app
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_readonly@postgres:5432/app
      LLM_MODE: mock
      LOG_LEVEL: INFO
      MAX_RESULT_ROWS: 1000
      QUERY_TIMEOUT_SECONDS: 10
      MAX_QUERY_JOINS: 5
      MAX_QUERY_NESTING: 3
      MAX_REPAIR_RETRIES: 3
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
