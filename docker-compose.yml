services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ANALYTICS_DATABASE_PASSWORD: ${ANALYTICS_DATABASE_PASSWORD:?Set ANALYTICS_DATABASE_PASSWORD in .env}
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/app}
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgresql+psycopg://analytics_readonly:${ANALYTICS_DATABASE_PASSWORD:?Set ANALYTICS_DATABASE_PASSWORD in .env}@postgres:5432/app}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      # Ollama runs on the host, not in Compose. From inside the container the host is
      # host.docker.internal (Docker Desktop on Mac and Windows; mapped below for Linux).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      # Optional LangSmith tracing. Off by default. When on, only sanitized metadata (ids,
      # provider, model, outcome codes, counts) is sent: never questions, SQL, rows or tenants.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-analytics-copilot}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      # Removed names, forwarded only so the app can refuse to start with a clear message
      # instead of silently running a different provider than the one in an old .env.
      LLM_MODE: ${LLM_MODE:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_RESULT_ROWS: ${MAX_RESULT_ROWS:-1000}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      MAX_QUERY_JOINS: ${MAX_QUERY_JOINS:-5}
      MAX_QUERY_NESTING: ${MAX_QUERY_NESTING:-3}
      MAX_REPAIR_RETRIES: ${MAX_REPAIR_RETRIES:-3}
      ENABLE_RESULT_SUMMARY: ${ENABLE_RESULT_SUMMARY:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      MAX_QUESTION_LENGTH: ${MAX_QUESTION_LENGTH:-2000}
      MAX_CONVERSATION_CONTEXT_CHARS: ${MAX_CONVERSATION_CONTEXT_CHARS:-2000}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-16384}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-30}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_LLM_REQUESTS: ${RATE_LIMIT_LLM_REQUESTS:-20}
      REQUEST_DEADLINE_SECONDS: ${REQUEST_DEADLINE_SECONDS:-25}
      ENABLE_DIRECT_SQL_ENDPOINTS: ${ENABLE_DIRECT_SQL_ENDPOINTS:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      # The backend is only reachable from the frontend container on the Compose network, so the
      # proxy's X-Forwarded-For can be trusted. Narrow this to the frontend's address if the
      # backend is ever exposed more widely.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      # Conversations and the audit trail are durable by default here because PostgreSQL is
      # already part of the stack; the `migrate` service creates their tables.
      CONVERSATION_STORE: ${CONVERSATION_STORE:-postgres}
      CONVERSATION_TTL_DAYS: ${CONVERSATION_TTL_DAYS:-30}
      AUDIT_SINK: ${AUDIT_SINK:-both}
      QUERY_COST_LIMIT: ${QUERY_COST_LIMIT:-1000000}
    # No published port: only the frontend (the same-origin proxy) reaches the backend.
    # Use docker-compose.dev.yml to publish it for local debugging.
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # /health/ready answers 200 while the instance can serve, including when it reports
    # {"status": "degraded"} (for example a missing LLM key), so Compose never restarts a healthy
    # container over an optional dependency. Only an unreachable database makes it unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration job. The backend never migrates at startup, so scaling it to several
  # replicas cannot race several migrations; `docker compose up` runs this once, first.
  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/app}
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgresql+psycopg://analytics_readonly:${ANALYTICS_DATABASE_PASSWORD:?Set ANALYTICS_DATABASE_PASSWORD in .env}@postgres:5432/app}
      APP_ENV: ${APP_ENV:-development}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Demo data for development, CI, and evaluation: `docker compose --profile demo run --rm seed`.
  # The seed refuses to run when APP_ENV=production.
  seed:
    profiles: ["demo"]
    build:
      context: ./backend
    command: ["python", "-m", "app.db.seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/app}
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgresql+psycopg://analytics_readonly:${ANALYTICS_DATABASE_PASSWORD:?Set ANALYTICS_DATABASE_PASSWORD in .env}@postgres:5432/app}
      APP_ENV: ${APP_ENV:-development}
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Retention: `docker compose --profile ops run --rm purge` (schedule it with cron or CI).
  purge:
    profiles: ["ops"]
    build:
      context: ./backend
    command: ["python", "-m", "app.jobs.purge"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/app}
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgresql+psycopg://analytics_readonly:${ANALYTICS_DATABASE_PASSWORD:?Set ANALYTICS_DATABASE_PASSWORD in .env}@postgres:5432/app}
      CONVERSATION_STORE: ${CONVERSATION_STORE:-postgres}
      CONVERSATION_TTL_DAYS: ${CONVERSATION_TTL_DAYS:-30}
      AUDIT_SINK: ${AUDIT_SINK:-both}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
