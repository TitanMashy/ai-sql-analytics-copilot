name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit tests, coverage)
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci-app.db
      ANALYTICS_DATABASE_URL: sqlite:///./ci-analytics.db
      POSTGRES_PASSWORD: ci-only-password
      ANALYTICS_DATABASE_PASSWORD: ci-only-readonly-password
      FUZZ_SEED: "20261006"
      FUZZ_ITERATIONS: "300"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: python -m ruff check .
      - name: Format check
        working-directory: backend
        run: python -m ruff format --check .
      - name: Type check
        working-directory: backend
        run: python -m mypy
      - name: Unit tests with coverage (includes the seeded fuzz run)
        working-directory: backend
        run: >-
          python -m pytest -m "not integration"
          --cov=app --cov-report=term --cov-report=json:coverage.json
      - name: Coverage gate for the security-critical packages
        working-directory: backend
        run: python scripts/check_coverage.py coverage.json
      - name: Lockfile is current
        run: |
          if [ -f backend/requirements.lock ]; then
            python -m pip install pip-tools
            make lock-check
          else
            echo "::warning::backend/requirements.lock does not exist yet. Run 'make lock' and commit it."
          fi
      - name: Dependency vulnerability audit
        working-directory: backend
        run: python -m pip_audit --skip-editable --progress-spinner off
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.json
          if-no-files-found: ignore

  integration:
    name: Integration (PostgreSQL, tenant isolation, evaluation subset)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-owner-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      LLM_MODE: mock
      DATABASE_URL: postgresql+psycopg://app:ci-owner-password@localhost:5432/app
      ANALYTICS_DATABASE_URL: postgresql+psycopg://analytics_readonly:ci-readonly-password@localhost:5432/app
      # A missing database must FAIL these tests, never skip them.
      REQUIRE_INTEGRATION: "1"
      PGPASSWORD: ci-owner-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Create the read-only analytics role
        env:
          ANALYTICS_DATABASE_PASSWORD: ci-readonly-password
        run: psql -h localhost -U app -d app -v ON_ERROR_STOP=1 -f database/init/01-analytics-role.sql
      - name: Migrate (one-shot, as in production)
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Seed demo data
        working-directory: backend
        run: python -m app.db.seed
      - name: Verify the privilege model
        run: psql -h localhost -U app -d app -v ON_ERROR_STOP=1 -f database/verify-readonly.sql
      - name: Migration downgrade and upgrade round trip
        working-directory: backend
        run: |
          python -m alembic downgrade 9a999e64b310
          python -m alembic upgrade head
      - name: Integration tests
        working-directory: backend
        run: python -m pytest -m integration -rs
      - name: Evaluation dataset runs against seeded PostgreSQL
        working-directory: backend
        run: python -m evals.run_eval --check-references
      - name: Deterministic evaluation subset (mock provider)
        working-directory: backend
        run: >-
          python -m evals.run_eval --provider mock --subset mock
          --report eval-report.json --markdown eval-summary.md
      - name: Publish evaluation summary
        if: always()
        run: |
          if [ -f backend/eval-summary.md ]; then cat backend/eval-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-mock
          path: |
            backend/eval-report.json
            backend/eval-summary.md
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tests, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend (includes the API contract check)
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Docker images (build, scan, Compose)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      ANALYTICS_DATABASE_PASSWORD: ci-only-readonly-password
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.loadtest.yml config --quiet
          docker compose --profile demo --profile ops config --quiet
      - name: Build backend image
        run: docker build -t analytics-backend:ci backend
      - name: Build frontend image
        run: docker build -t analytics-frontend:ci --build-arg INTERNAL_API_URL=http://backend:8000 frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: analytics-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: analytics-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
