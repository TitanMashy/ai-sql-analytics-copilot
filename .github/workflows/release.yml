name: Release

# Tag-driven: pushing a tag like v1.2.0 builds immutable, scanned, SBOM-attached images, publishes
# release notes, deploys to staging, smoke-tests it, and only then (after the manual approval that
# the "production" environment must be configured to require) deploys to production.
#
# Repository setup needed once:
#   Environments "staging" and "production" (production with required reviewers), each with:
#     secrets: SMOKE_TOKEN (a bearer token for an authenticated /ask), any credentials the
#              scripts/deploy.d/<environment>.sh hook needs
#     variables: BASE_URL (the environment's frontend or ingress URL)
#   See docs/operations.md, "Release process".
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write   # create the release
  packages: write   # push images to GHCR
  id-token: write   # provenance attestation

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/analytics

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci-app.db
      ANALYTICS_DATABASE_URL: sqlite:///./ci-analytics.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Backend lint and unit tests
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m pytest -m "not integration"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint, tests, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test -- --run
          npm run build

  images:
    name: Build, scan, and push ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive the version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed yet) so it can be scanned first
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: false
          load: true
          tags: scan-candidate:${{ matrix.component }}
          build-args: |
            INTERNAL_API_URL=http://backend:8000
      - name: Scan before publishing
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-candidate:${{ matrix.component }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push with an immutable version tag, an SBOM, and provenance
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.version.outputs.version }}
          sbom: true
          provenance: mode=max
          build-args: |
            INTERNAL_API_URL=http://backend:8000
      - name: Record what was published
        run: |
          echo "### ${{ matrix.component }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  release-notes:
    name: Publish release notes
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the previous tag can be found
      - name: Generate notes from conventional commits
        run: python3 scripts/release_notes.py --to "$GITHUB_REF_NAME" --output RELEASE_NOTES.md
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  staging:
    name: Deploy to staging and smoke test
    runs-on: ubuntu-latest
    needs: [images, release-notes]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: scripts/deploy.sh staging "${{ needs.images.outputs.version }}"
      - name: Smoke test (liveness, readiness, one authenticated /ask)
        run: >-
          python3 scripts/smoke_test.py --base-url "${{ vars.BASE_URL }}"
          --token "${{ secrets.SMOKE_TOKEN }}" --wait 300

  production:
    name: Promote to production
    runs-on: ubuntu-latest
    needs: [images, staging]
    environment: production   # configure required reviewers on this environment
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the same immutable images
        run: scripts/deploy.sh production "${{ needs.images.outputs.version }}"
      - name: Smoke test
        run: >-
          python3 scripts/smoke_test.py --base-url "${{ vars.BASE_URL }}"
          --token "${{ secrets.SMOKE_TOKEN }}" --wait 300
      - name: If the smoke test failed, say how to roll back
        if: failure()
        run: |
          echo "::error::Production smoke test failed for ${{ needs.images.outputs.version }}."
          echo "Roll back by deploying the previous tag: scripts/deploy.sh production <previous version>."
          echo "See docs/operations.md, 'Rollback'."
